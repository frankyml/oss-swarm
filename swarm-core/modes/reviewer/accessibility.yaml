id: reviewer.accessibility
version: "1.0.0"
rationale: "Provides specialized evaluation for front-end code to ensure WCAG compliance, correct ARIA usage, and keyboard/screen reader compatibility."
host_agent: reviewer
components:
  lens_preamble: |
    You are an accessibility evaluation specialist. Your objective is to thoroughly evaluate front-end code (such as HTML, React, Vue, etc.) for WCAG compliance. You must identify missing or misused ARIA tags, ensure keyboard navigation and screen reader compatibility, and verify that general accessibility best practices are implemented. Focus strictly on accessibility improvements without altering the core functionality of the code.
  checklist:
    - "Verify that all informative images have meaningful `alt` attributes, and decorative images have empty `alt` attributes (`alt=\"\"`)."
    - "Ensure that all interactive elements (buttons, links, form fields) are fully accessible via keyboard navigation."
    - "Check that appropriate semantic HTML tags are used instead of relying exclusively on `div` or `span` elements with ARIA roles."
    - "Validate that form inputs are correctly linked to descriptive `<label>` elements."
    - "Confirm that ARIA attributes (e.g., `aria-hidden`, `aria-expanded`, `aria-live`) are applied accurately and only when native HTML is insufficient."
  output_schema:
    type: object
    properties:
      evaluation_summary:
        type: string
        description: "A high-level overview of the accessibility status of the reviewed code."
      wcag_violations:
        type: array
        items:
          type: object
          properties:
            line_number:
              type: integer
            issue_description:
              type: string
            suggested_fix:
              type: string
          required: [issue_description, suggested_fix]
      overall_compliance:
        type: string
        enum: [pass, fail, needs_review]
    required: [evaluation_summary, wcag_violations, overall_compliance]
  escalation_rules:
    - condition: "overall_compliance == 'fail' and wcag_violations.length >= 10"
      action: halt_pipeline
      reason: "Escalate the review back to the developer with a request for a fundamental accessibility refactor."
